<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedTrack Pro - Event & Vaccine Management</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* --- CORE STYLES & VARIABLES --- */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --sidebar-w: 250px;
            --header-h: 60px;
            --radius-md: 8px;
            --radius-sm: 4px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* --- LAYOUT --- */
        .app-container { display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar {
            width: var(--sidebar-w); background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
        }
        .sidebar-header {
            height: var(--header-h); display: flex; align-items: center;
            padding: 0 20px; font-weight: bold; font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color); color: var(--primary);
        }
        .nav-list { list-style: none; padding: 10px 0; }
        .nav-item {
            padding: 12px 20px; cursor: pointer; display: flex; align-items: center;
            gap: 10px; color: var(--text-muted); transition: all 0.2s;
        }
        .nav-item:hover { background-color: var(--bg-main); color: var(--primary); }
        .nav-item.active {
            background-color: #eff6ff; color: var(--primary);
            border-right: 3px solid var(--primary);
        }

        .main-content {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }
        .topbar {
            height: var(--header-h); background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
        }
        .content-area {
            flex: 1; padding: 20px; overflow-y: auto;
        }

        /* --- COMPONENTS --- */
        .card {
            background: var(--bg-card); border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm); padding: 20px; border: 1px solid var(--border-color);
        }
        
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: var(--radius-sm); border: none;
            font-weight: 500; cursor: pointer; transition: background 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 4px 8px; font-size: 0.8rem; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; }
        .form-control {
            width: 100%; padding: 8px 12px; border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); font-family: inherit; font-size: 0.95rem;
        }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }

        /* --- TABLES --- */
        .table-responsive { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--bg-main); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); }
        tbody tr:hover { background-color: #f8fafc; }

        /* --- BADGES --- */
        .badge {
            padding: 4px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600;
            display: inline-block;
        }
        .bg-blue { background: #dbeafe; color: #1e40af; }
        .bg-green { background: #d1fae5; color: #065f46; }
        .bg-yellow { background: #fef3c7; color: #92400e; }
        .bg-red { background: #fee2e2; color: #991b1b; }
        .bg-gray { background: #f1f5f9; color: #475569; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-card); padding: 20px; border-radius: var(--radius-md);
            width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
            box-shadow: var(--shadow-md);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 1.25rem; font-weight: bold; }
        
        /* --- TABS --- */
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; gap: 2px; }
        .tab-btn {
            padding: 10px 20px; background: transparent; border: none; border-bottom: 2px solid transparent;
            cursor: pointer; font-weight: 500; color: var(--text-muted);
        }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-btn:hover:not(.active) { color: var(--text-main); }

        /* --- UTILS --- */
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-gap { display: flex; gap: 10px; }
        .mt-4 { margin-top: 1rem; }
        .mb-4 { margin-bottom: 1rem; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 0.875rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useMemo } = React;

        // --- SHARED / ICONS (Inline SVGs to guarantee availability) ---
        const Icons = {
            Dashboard: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>,
            Event: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Vial: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10 2v7.31"></path><path d="M14 9.3V1.99"></path><path d="M8.5 2h7"></path><path d="M14 9.3a6.5 6.5 0 1 1-4 0"></path><line x1="5.52" y1="16" x2="18.48" y2="16"></line></svg>,
            PO: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>,
            Download: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            Plus: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Close: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Alert: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        };

        // --- UTILS ---
        const generateId = (prefix) => `${prefix}${Date.now().toString(36)}${Math.random().toString(36).substr(2, 5)}`.toUpperCase();
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        };
        const getDaysUntil = (dateStr) => {
            const today = new Date();
            const target = new Date(dateStr);
            const diffTime = target - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        };

        // --- API / STORAGE LAYER (Mock Backend ready to be replaced) ---
        // We simulate async delays to represent network requests.
        const STORAGE_KEY = 'medtrack_data_v1';
        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        class ApiService {
            static _getData() {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : { events: [], pos: [], vials: [] };
            }
            static _saveData(data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            // Events
            static async getEvents() { await delay(100); return this._getData().events; }
            static async saveEvent(eventData) {
                await delay(200);
                const data = this._getData();
                const isNew = !eventData.id;
                const ev = isNew ? { ...eventData, id: generateId('EV-') } : eventData;
                
                if (isNew) data.events.push(ev);
                else data.events = data.events.map(e => e.id === ev.id ? ev : e);
                
                this._saveData(data);
                return ev;
            }

            // Purchase Orders & Vials
            static async getPOs() { await delay(100); return this._getData().pos; }
            static async getVials() { await delay(100); return this._getData().vials; }
            
            static async createPO(poData) {
                await delay(300); // Simulate heavier operation
                const data = this._getData();
                const newPO = { ...poData, id: generateId('PO-') };
                data.pos.push(newPO);

                // CRITICAL LOGIC: Generate individual vials
                const todayPrefix = new Date().toISOString().slice(2, 10).replace(/-/g, '');
                let seqCounter = data.vials.filter(v => v.id.includes(todayPrefix)).length + 1;
                
                const qty = parseInt(poData.quantity, 10);
                const dosesPerVial = parseInt(poData.dosesPerVial, 10) || 1;

                for (let i = 0; i < qty; i++) {
                    const seqStr = String(seqCounter).padStart(3, '0');
                    data.vials.push({
                        id: `VX-${todayPrefix}-${seqStr}`,
                        poId: newPO.id,
                        vaccineType: newPO.vaccineType,
                        lotNumber: newPO.lotNumber,
                        expiredDate: newPO.expiredDate,
                        dosesTotal: dosesPerVial,
                        dosesRemaining: dosesPerVial,
                        status: 'in stock', // in stock, allocated, used, expired, broken, returned
                        usageHistory: [] // {eventId, date, dosesUsed, doseRemainingAfter}
                    });
                    seqCounter++;
                }

                this._saveData(data);
                return { po: newPO };
            }

            static async updateVial(vialData) {
                await delay(100);
                const data = this._getData();
                data.vials = data.vials.map(v => v.id === vialData.id ? vialData : v);
                this._saveData(data);
                return vialData;
            }
        }

        // --- APP CONTEXT ---
        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [events, setEvents] = useState([]);
            const [pos, setPos] = useState([]);
            const [vials, setVials] = useState([]);
            const [loading, setLoading] = useState(true);

            const loadAllData = async () => {
                setLoading(true);
                const [e, p, v] = await Promise.all([
                    ApiService.getEvents(),
                    ApiService.getPOs(),
                    ApiService.getVials()
                ]);
                setEvents(e); setPos(p); setVials(v);
                setLoading(false);
            };

            useEffect(() => { loadAllData(); }, []);

            const exportData = () => {
                const data = JSON.stringify({ events, pos, vials }, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `MedTrack_Backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            };

            return (
                <AppContext.Provider value={{
                    events, pos, vials, loading, reloadData: loadAllData, exportData,
                    addPO: async (data) => { await ApiService.createPO(data); await loadAllData(); },
                    saveEvent: async (data) => { await ApiService.saveEvent(data); await loadAllData(); },
                    updateVial: async (data) => { await ApiService.updateVial(data); await loadAllData(); }
                }}>
                    {children}
                </AppContext.Provider>
            );
        };

        // --- SHARED COMPONENTS ---
        const Modal = ({ title, isOpen, onClose, children }) => {
            if (!isOpen) return null;
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2 className="modal-title">{title}</h2>
                            <button onClick={onClose} style={{background:'none', border:'none', cursor:'pointer'}}><Icons.Close /></button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        };

        const StatusBadge = ({ status }) => {
            const map = {
                'draft': 'bg-gray', 'confirmed': 'bg-blue', 'ongoing': 'bg-yellow', 'done': 'bg-green', 'cancelled': 'bg-red',
                'in stock': 'bg-green', 'allocated': 'bg-blue', 'used': 'bg-gray', 'expired': 'bg-red', 'broken': 'bg-red'
            };
            const colorClass = map[status?.toLowerCase()] || 'bg-gray';
            return <span className={`badge ${colorClass}`}>{status?.toUpperCase()}</span>;
        };

        // --- FEATURE: DASHBOARD ---
        const Dashboard = () => {
            const { vials, events } = useContext(AppContext);

            const stats = useMemo(() => {
                const inStockVials = vials.filter(v => v.status === 'in stock');
                const totalDoses = inStockVials.reduce((sum, v) => sum + v.dosesRemaining, 0);
                const upcomingEvents = events.filter(e => ['draft', 'confirmed'].includes(e.status));
                const expiringVials = inStockVials.filter(v => {
                    const days = getDaysUntil(v.expiredDate);
                    return days >= 0 && days <= 30;
                }).sort((a,b) => new Date(a.expiredDate) - new Date(b.expiredDate));

                return { inStockCount: inStockVials.length, totalDoses, upcomingCount: upcomingEvents.length, expiringVials };
            }, [vials, events]);

            return (
                <div>
                    <h2 className="mb-4">Dashboard Overview</h2>
                    <div className="grid-3 mb-4">
                        <div className="card">
                            <div className="text-muted text-sm mb-2">Vials In Stock</div>
                            <div style={{fontSize: '2rem', fontWeight: 'bold'}}>{stats.inStockCount}</div>
                            <div className="text-sm text-muted mt-2">({stats.totalDoses} doses available)</div>
                        </div>
                        <div className="card">
                            <div className="text-muted text-sm mb-2">Upcoming Events</div>
                            <div style={{fontSize: '2rem', fontWeight: 'bold'}}>{stats.upcomingCount}</div>
                        </div>
                        <div className="card" style={{borderLeft: '4px solid var(--warning)'}}>
                            <div className="text-muted text-sm mb-2">Expiring Vials (≤ 30 days)</div>
                            <div style={{fontSize: '2rem', fontWeight: 'bold', color: 'var(--warning)'}}>
                                {stats.expiringVials.length}
                            </div>
                        </div>
                    </div>

                    <div className="card">
                        <h3 className="mb-4 flex-gap" style={{alignItems:'center'}}>
                            <Icons.Alert /> Critical Alerts: Expiring Soon
                        </h3>
                        {stats.expiringVials.length === 0 ? (
                            <p className="text-muted">No vials expiring within 30 days.</p>
                        ) : (
                            <div className="table-responsive">
                                <table>
                                    <thead><tr><th>Vial ID</th><th>Vaccine Type</th><th>Lot #</th><th>Expiry Date</th><th>Days Left</th></tr></thead>
                                    <tbody>
                                        {stats.expiringVials.map(v => (
                                            <tr key={v.id}>
                                                <td><strong>{v.id}</strong></td>
                                                <td>{v.vaccineType}</td>
                                                <td>{v.lotNumber}</td>
                                                <td>{formatDate(v.expiredDate)}</td>
                                                <td style={{color: 'var(--danger)', fontWeight: 'bold'}}>
                                                    {getDaysUntil(v.expiredDate)} days
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- FEATURE: PURCHASE ORDERS ---
        const PurchaseOrders = () => {
            const { pos, addPO } = useContext(AppContext);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formData, setFormData] = useState({
                supplier: '', purchaseDate: '', vaccineType: '', quantity: '', 
                pricePerVial: '', lotNumber: '', expiredDate: '', dosesPerVial: '1', notes: ''
            });

            const handleSubmit = async (e) => {
                e.preventDefault();
                const total = parseFloat(formData.quantity) * parseFloat(formData.pricePerVial);
                await addPO({ ...formData, totalPrice: total });
                setIsModalOpen(false);
                setFormData({ supplier: '', purchaseDate: '', vaccineType: '', quantity: '', pricePerVial: '', lotNumber: '', expiredDate: '', dosesPerVial: '1', notes: ''});
            };

            return (
                <div>
                    <div className="flex-between mb-4">
                        <h2>Purchase Orders</h2>
                        <button className="btn btn-primary" onClick={() => setIsModalOpen(true)}>
                            <Icons.Plus /> New PO
                        </button>
                    </div>

                    <div className="card table-responsive">
                        <table>
                            <thead>
                                <tr><th>PO Number</th><th>Date</th><th>Supplier</th><th>Vaccine</th><th>Qty</th><th>Lot #</th><th>Total Cost</th></tr>
                            </thead>
                            <tbody>
                                {pos.length === 0 ? <tr><td colSpan="7" className="text-center text-muted">No Purchase Orders yet.</td></tr> :
                                pos.map(po => (
                                    <tr key={po.id}>
                                        <td><strong>{po.id}</strong></td>
                                        <td>{formatDate(po.purchaseDate)}</td>
                                        <td>{po.supplier}</td>
                                        <td>{po.vaccineType}</td>
                                        <td>{po.quantity} (x{po.dosesPerVial}d)</td>
                                        <td>{po.lotNumber}</td>
                                        <td>Rp {po.totalPrice?.toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <Modal title="Create Purchase Order" isOpen={isModalOpen} onClose={() => setIsModalOpen(false)}>
                        <form onSubmit={handleSubmit}>
                            <div className="form-row">
                                <div className="form-group">
                                    <label>Supplier</label>
                                    <input required type="text" className="form-control" value={formData.supplier} onChange={e => setFormData({...formData, supplier: e.target.value})} />
                                </div>
                                <div className="form-group">
                                    <label>Purchase Date</label>
                                    <input required type="date" className="form-control" value={formData.purchaseDate} onChange={e => setFormData({...formData, purchaseDate: e.target.value})} />
                                </div>
                            </div>
                            <div className="form-row">
                                <div className="form-group">
                                    <label>Vaccine Type</label>
                                    <input required type="text" className="form-control" placeholder="e.g. Fluarix Tetra" value={formData.vaccineType} onChange={e => setFormData({...formData, vaccineType: e.target.value})} />
                                </div>
                                <div className="form-group">
                                    <label>Lot Number</label>
                                    <input required type="text" className="form-control" value={formData.lotNumber} onChange={e => setFormData({...formData, lotNumber: e.target.value})} />
                                </div>
                            </div>
                            <div className="form-row">
                                <div className="form-group">
                                    <label>Qty (Vials)</label>
                                    <input required type="number" min="1" className="form-control" value={formData.quantity} onChange={e => setFormData({...formData, quantity: e.target.value})} />
                                </div>
                                <div className="form-group">
                                    <label>Doses per Vial</label>
                                    <input required type="number" min="1" className="form-control" value={formData.dosesPerVial} onChange={e => setFormData({...formData, dosesPerVial: e.target.value})} />
                                </div>
                            </div>
                            <div className="form-row">
                                <div className="form-group">
                                    <label>Expiry Date</label>
                                    <input required type="date" className="form-control" value={formData.expiredDate} onChange={e => setFormData({...formData, expiredDate: e.target.value})} />
                                </div>
                                <div className="form-group">
                                    <label>Price per Vial</label>
                                    <input required type="number" min="0" className="form-control" value={formData.pricePerVial} onChange={e => setFormData({...formData, pricePerVial: e.target.value})} />
                                </div>
                            </div>
                            <div className="form-group">
                                <label>Notes</label>
                                <textarea className="form-control" rows="2" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})}></textarea>
                            </div>
                            <div className="mt-4" style={{textAlign: 'right'}}>
                                <button type="button" className="btn btn-secondary" style={{marginRight: '10px'}} onClick={() => setIsModalOpen(false)}>Cancel</button>
                                <button type="submit" className="btn btn-primary">Save & Generate Vials</button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        };

        // --- FEATURE: VIALS ---
        const Vials = () => {
            const { vials } = useContext(AppContext);
            const [selectedVial, setSelectedVial] = useState(null);

            return (
                <div>
                    <h2 className="mb-4">Vial Tracker</h2>
                    <div className="card table-responsive">
                        <table>
                            <thead>
                                <tr><th>Vial ID</th><th>Vaccine</th><th>Lot #</th><th>Expiry</th><th>Doses</th><th>Status</th><th>Action</th></tr>
                            </thead>
                            <tbody>
                                {vials.map(v => (
                                    <tr key={v.id}>
                                        <td><strong>{v.id}</strong></td>
                                        <td>{v.vaccineType}</td>
                                        <td>{v.lotNumber}</td>
                                        <td>{formatDate(v.expiredDate)}</td>
                                        <td>{v.dosesRemaining} / {v.dosesTotal}</td>
                                        <td><StatusBadge status={v.status} /></td>
                                        <td>
                                            <button className="btn btn-secondary btn-sm" onClick={() => setSelectedVial(v)}>Details</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <Modal title={`Vial Details: ${selectedVial?.id}`} isOpen={!!selectedVial} onClose={() => setSelectedVial(null)}>
                        {selectedVial && (
                            <div>
                                <div className="grid-2 mb-4">
                                    <div>
                                        <p className="text-sm text-muted">Origin PO</p>
                                        <p><strong>{selectedVial.poId}</strong></p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-muted">Status</p>
                                        <p><StatusBadge status={selectedVial.status} /></p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-muted">Vaccine & Lot</p>
                                        <p>{selectedVial.vaccineType} (Lot: {selectedVial.lotNumber})</p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-muted">Expiry</p>
                                        <p>{formatDate(selectedVial.expiredDate)}</p>
                                    </div>
                                </div>
                                <h4 className="mb-2">Usage History</h4>
                                {selectedVial.usageHistory?.length > 0 ? (
                                    <table className="table-responsive">
                                        <thead><tr><th>Date</th><th>Event ID</th><th>Doses Used</th><th>Remaining</th></tr></thead>
                                        <tbody>
                                            {selectedVial.usageHistory.map((h, i) => (
                                                <tr key={i}>
                                                    <td>{formatDate(h.date)}</td>
                                                    <td>{h.eventId}</td>
                                                    <td>{h.dosesUsed}</td>
                                                    <td>{h.doseRemainingAfter}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                ) : (
                                    <p className="text-muted text-sm">No usage history recorded yet.</p>
                                )}
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };

        // --- FEATURE: EVENTS (List & Form) ---
        const Events = () => {
            const { events, saveEvent } = useContext(AppContext);
            const [viewingEvent, setViewingEvent] = useState(null);
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [formData, setFormData] = useState({});

            const openForm = (ev = null) => {
                if(ev) setFormData(ev);
                else setFormData({ name: '', client: '', location: '', dateStart: '', dateEnd: '', type: 'vaksinasi', status: 'draft', manpower: [], checklist: [], requirements: [] });
                setIsFormOpen(true);
            };

            const handleSaveBasic = async (e) => {
                e.preventDefault();
                await saveEvent(formData);
                setIsFormOpen(false);
            };

            if (viewingEvent) {
                return <EventDetail eventId={viewingEvent} onBack={() => setViewingEvent(null)} />;
            }

            return (
                <div>
                    <div className="flex-between mb-4">
                        <h2>Events</h2>
                        <button className="btn btn-primary" onClick={() => openForm()}><Icons.Plus /> New Event</button>
                    </div>

                    <div className="card table-responsive">
                        <table>
                            <thead>
                                <tr><th>Event ID</th><th>Name</th><th>Client</th><th>Date</th><th>Type</th><th>Status</th><th>Actions</th></tr>
                            </thead>
                            <tbody>
                                {events.map(ev => (
                                    <tr key={ev.id}>
                                        <td><strong>{ev.id}</strong></td>
                                        <td>{ev.name}</td>
                                        <td>{ev.client}</td>
                                        <td>{formatDate(ev.dateStart)}</td>
                                        <td style={{textTransform:'capitalize'}}>{ev.type}</td>
                                        <td><StatusBadge status={ev.status} /></td>
                                        <td>
                                            <button className="btn btn-primary btn-sm" onClick={() => setViewingEvent(ev.id)}>Manage</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <Modal title={formData.id ? "Edit Event" : "Create Event"} isOpen={isFormOpen} onClose={() => setIsFormOpen(false)}>
                        <form onSubmit={handleSaveBasic}>
                            <div className="form-group">
                                <label>Event Name</label>
                                <input required type="text" className="form-control" value={formData.name || ''} onChange={e => setFormData({...formData, name: e.target.value})} />
                            </div>
                            <div className="form-row">
                                <div className="form-group">
                                    <label>Client</label>
                                    <input required type="text" className="form-control" value={formData.client || ''} onChange={e => setFormData({...formData, client: e.target.value})} />
                                </div>
                                <div className="form-group">
                                    <label>Type</label>
                                    <select className="form-control" value={formData.type || ''} onChange={e => setFormData({...formData, type: e.target.value})}>
                                        <option value="vaksinasi">Vaksinasi</option>
                                        <option value="mcu">MCU/MMCU</option>
                                        <option value="wellness">Wellness Day</option>
                                        <option value="donor">Donor Darah</option>
                                        <option value="custom">Custom</option>
                                    </select>
                                </div>
                            </div>
                            <div className="form-group">
                                <label>Location</label>
                                <input required type="text" className="form-control" value={formData.location || ''} onChange={e => setFormData({...formData, location: e.target.value})} />
                            </div>
                            <div className="form-row">
                                <div className="form-group">
                                    <label>Date Start</label>
                                    <input required type="date" className="form-control" value={formData.dateStart || ''} onChange={e => setFormData({...formData, dateStart: e.target.value})} />
                                </div>
                                <div className="form-group">
                                    <label>Date End</label>
                                    <input type="date" className="form-control" value={formData.dateEnd || ''} onChange={e => setFormData({...formData, dateEnd: e.target.value})} />
                                </div>
                            </div>
                            <div className="form-group">
                                <label>Status</label>
                                <select className="form-control" value={formData.status || ''} onChange={e => setFormData({...formData, status: e.target.value})}>
                                    <option value="draft">Draft</option>
                                    <option value="confirmed">Confirmed</option>
                                    <option value="ongoing">Ongoing</option>
                                    <option value="done">Done</option>
                                    <option value="cancelled">Cancelled</option>
                                </select>
                            </div>
                            <div className="mt-4" style={{textAlign: 'right'}}>
                                <button type="button" className="btn btn-secondary" style={{marginRight: '10px'}} onClick={() => setIsFormOpen(false)}>Cancel</button>
                                <button type="submit" className="btn btn-primary">Save Info</button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        };

        // --- FEATURE: EVENT DETAIL (TABS) ---
        const EventDetail = ({ eventId, onBack }) => {
            const { events, saveEvent, vials, updateVial } = useContext(AppContext);
            const [activeTab, setActiveTab] = useState('info');
            const event = events.find(e => e.id === eventId);

            if (!event) return <p>Event not found</p>;

            const updateEventField = async (field, data) => {
                const updatedEvent = { ...event, [field]: data };
                await saveEvent(updatedEvent);
            };

            return (
                <div>
                    <div className="flex-gap mb-4" style={{alignItems:'center'}}>
                        <button className="btn btn-secondary" onClick={onBack}>← Back</button>
                        <h2 style={{margin:0}}>{event.name} <StatusBadge status={event.status} /></h2>
                    </div>

                    <div className="card" style={{padding:0}}>
                        <div className="tabs" style={{padding: '0 20px', background: 'var(--bg-main)'}}>
                            {['info', 'manpower', 'checklist', 'requirements'].map(tab => (
                                <button key={tab} className={`tab-btn ${activeTab === tab ? 'active' : ''}`} onClick={() => setActiveTab(tab)}>
                                    {tab.charAt(0).toUpperCase() + tab.slice(1)}
                                </button>
                            ))}
                        </div>
                        <div style={{padding: '20px'}}>
                            {activeTab === 'info' && (
                                <div className="grid-2">
                                    <div>
                                        <p className="text-muted text-sm">Client</p><p className="mb-4"><strong>{event.client}</strong></p>
                                        <p className="text-muted text-sm">Location</p><p className="mb-4"><strong>{event.location}</strong></p>
                                        <p className="text-muted text-sm">Type</p><p className="mb-4" style={{textTransform:'capitalize'}}><strong>{event.type}</strong></p>
                                    </div>
                                    <div>
                                        <p className="text-muted text-sm">Start Date</p><p className="mb-4"><strong>{formatDate(event.dateStart)}</strong></p>
                                        <p className="text-muted text-sm">End Date</p><p className="mb-4"><strong>{formatDate(event.dateEnd)}</strong></p>
                                    </div>
                                </div>
                            )}
                            
                            {activeTab === 'manpower' && <ManpowerTab event={event} onUpdate={(data) => updateEventField('manpower', data)} />}
                            {activeTab === 'checklist' && <ChecklistTab event={event} onUpdate={(data) => updateEventField('checklist', data)} />}
                            {activeTab === 'requirements' && <RequirementsTab event={event} onUpdate={(data) => updateEventField('requirements', data)} vials={vials} updateVial={updateVial} />}
                        </div>
                    </div>
                </div>
            );
        };

        const ManpowerTab = ({ event, onUpdate }) => {
            const list = event.manpower || [];
            const addPerson = () => onUpdate([...list, { role: 'Dokter', name: '' }]);
            const updatePerson = (idx, field, val) => {
                const newList = [...list]; newList[idx][field] = val; onUpdate(newList);
            };
            const removePerson = (idx) => { onUpdate(list.filter((_, i) => i !== idx)); };

            return (
                <div>
                    <button className="btn btn-secondary btn-sm mb-4" onClick={addPerson}>+ Add Personnel</button>
                    {list.map((p, idx) => (
                        <div key={idx} className="flex-gap mb-2">
                            <select className="form-control" style={{width:'150px'}} value={p.role} onChange={e => updatePerson(idx, 'role', e.target.value)}>
                                {['Dokter', 'Perawat', 'Regis', 'Runner', 'Helper'].map(r => <option key={r} value={r}>{r}</option>)}
                            </select>
                            <input type="text" className="form-control" placeholder="Name" value={p.name} onChange={e => updatePerson(idx, 'name', e.target.value)} />
                            <button className="btn btn-danger btn-sm" onClick={() => removePerson(idx)}><Icons.Trash/></button>
                        </div>
                    ))}
                    {list.length === 0 && <p className="text-muted">No personnel assigned yet.</p>}
                </div>
            );
        };

        const ChecklistTab = ({ event, onUpdate }) => {
            const list = event.checklist || [];
            const addTask = () => onUpdate([...list, { item: '', status: 'pending', pic: '', deadline: '' }]);
            const updateTask = (idx, field, val) => {
                const newList = [...list]; newList[idx][field] = val; onUpdate(newList);
            };
            const removeTask = (idx) => onUpdate(list.filter((_, i) => i !== idx));

            return (
                <div>
                    <button className="btn btn-secondary btn-sm mb-4" onClick={addTask}>+ Add Task</button>
                    {list.map((t, idx) => (
                        <div key={idx} className="flex-gap mb-2" style={{alignItems:'center'}}>
                            <input type="checkbox" checked={t.status === 'done'} onChange={e => updateTask(idx, 'status', e.target.checked ? 'done' : 'pending')} />
                            <input type="text" className="form-control" style={{flex:2}} placeholder="Task description" value={t.item} onChange={e => updateTask(idx, 'item', e.target.value)} />
                            <input type="text" className="form-control" style={{flex:1}} placeholder="PIC" value={t.pic} onChange={e => updateTask(idx, 'pic', e.target.value)} />
                            <input type="date" className="form-control" style={{width:'140px'}} value={t.deadline} onChange={e => updateTask(idx, 'deadline', e.target.value)} />
                            <button className="btn btn-danger btn-sm" onClick={() => removeTask(idx)}><Icons.Trash/></button>
                        </div>
                    ))}
                    {list.length === 0 && <p className="text-muted">No checklist items yet.</p>}
                </div>
            );
        };

        // --- FEATURE: EVENT REQUIREMENTS & VIAL ALLOCATION ---
        const RequirementsTab = ({ event, onUpdate, vials, updateVial }) => {
            const list = event.requirements || [];
            const [allocatingIndex, setAllocatingIndex] = useState(null); // Which requirement is requesting allocation

            const addReq = () => onUpdate([...list, { item: '', qty: 1, unit: 'pcs', status: 'pending', source: 'stock', vialAllocations: [] }]);
            const updateReq = (idx, field, val) => {
                const newList = [...list]; newList[idx][field] = val; onUpdate(newList);
            };
            const removeReq = (idx) => onUpdate(list.filter((_, i) => i !== idx));

            // FEFO Logic
            const inStockVials = vials.filter(v => v.status === 'in stock' && v.dosesRemaining > 0)
                                      .sort((a, b) => new Date(a.expiredDate) - new Date(b.expiredDate));

            const handleAllocate = async (vialId, dosesToUse) => {
                const vial = vials.find(v => v.id === vialId);
                const req = list[allocatingIndex];
                
                // 1. Update Vial
                const remaining = vial.dosesRemaining - dosesToUse;
                const newStatus = remaining <= 0 ? 'used' : 'in stock';
                const usageEntry = { eventId: event.id, date: new Date().toISOString(), dosesUsed: dosesToUse, doseRemainingAfter: remaining };
                
                await updateVial({
                    ...vial,
                    dosesRemaining: remaining,
                    status: newStatus,
                    usageHistory: [...vial.usageHistory, usageEntry]
                });

                // 2. Update Event Requirement
                const newAllocations = [...(req.vialAllocations || []), { vialId, doses: dosesToUse }];
                updateReq(allocatingIndex, 'vialAllocations', newAllocations);
                setAllocatingIndex(null);
            };

            return (
                <div>
                    <button className="btn btn-secondary btn-sm mb-4" onClick={addReq}>+ Add Requirement</button>
                    <div className="table-responsive">
                        <table>
                            <thead><tr><th>Item/Vaccine</th><th>Qty Needed</th><th>Unit</th><th>Source</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody>
                                {list.map((req, idx) => (
                                    <tr key={idx}>
                                        <td><input type="text" className="form-control" value={req.item} onChange={e => updateReq(idx, 'item', e.target.value)} placeholder="e.g. Fluarix / Spuit" /></td>
                                        <td><input type="number" className="form-control" style={{width:'80px'}} value={req.qty} onChange={e => updateReq(idx, 'qty', e.target.value)} /></td>
                                        <td><input type="text" className="form-control" style={{width:'80px'}} value={req.unit} onChange={e => updateReq(idx, 'unit', e.target.value)} placeholder="vial/pcs" /></td>
                                        <td>
                                            <select className="form-control" value={req.source} onChange={e => updateReq(idx, 'source', e.target.value)}>
                                                <option value="stock">Gudang</option>
                                                <option value="buy">Beli</option>
                                            </select>
                                        </td>
                                        <td>
                                            <select className="form-control" value={req.status} onChange={e => updateReq(idx, 'status', e.target.value)}>
                                                <option value="pending">Pending</option>
                                                <option value="prepared">Prepared</option>
                                            </select>
                                        </td>
                                        <td>
                                            <div className="flex-gap">
                                                {event.type === 'vaksinasi' && (
                                                    <button className="btn btn-primary btn-sm" onClick={() => setAllocatingIndex(idx)}>Allocate Vial</button>
                                                )}
                                                <button className="btn btn-danger btn-sm" onClick={() => removeReq(idx)}><Icons.Trash/></button>
                                            </div>
                                            {req.vialAllocations?.length > 0 && (
                                                <div className="text-sm mt-1" style={{color: 'var(--success)'}}>
                                                    Allocated: {req.vialAllocations.map(a => `${a.vialId}(${a.doses}d)`).join(', ')}
                                                </div>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        {list.length === 0 && <p className="text-muted mt-2">No logistics required yet.</p>}
                    </div>

                    {/* Allocation Modal (FEFO) */}
                    <Modal title="Allocate Vaccine Vials (FEFO Suggested)" isOpen={allocatingIndex !== null} onClose={() => setAllocatingIndex(null)}>
                        <p className="mb-2 text-sm text-muted">Vials are sorted by nearest expiry date first.</p>
                        <div className="table-responsive">
                            <table>
                                <thead><tr><th>Vial ID</th><th>Vaccine</th><th>Expiry</th><th>Doses Available</th><th>Action</th></tr></thead>
                                <tbody>
                                    {inStockVials.map(v => (
                                        <tr key={v.id}>
                                            <td>{v.id}</td>
                                            <td>{v.vaccineType}</td>
                                            <td style={{color: getDaysUntil(v.expiredDate) < 30 ? 'var(--danger)' : 'inherit'}}>{formatDate(v.expiredDate)}</td>
                                            <td>{v.dosesRemaining}</td>
                                            <td>
                                                <button className="btn btn-primary btn-sm" onClick={() => {
                                                    const useStr = prompt(`How many doses to use from ${v.id}? (Max ${v.dosesRemaining})`, "1");
                                                    const useNum = parseInt(useStr, 10);
                                                    if (useNum > 0 && useNum <= v.dosesRemaining) handleAllocate(v.id, useNum);
                                                    else if (useStr !== null) alert('Invalid dose amount');
                                                }}>Use</button>
                                            </td>
                                        </tr>
                                    ))}
                                    {inStockVials.length === 0 && <tr><td colSpan="5" className="text-center">No vials available in stock.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </Modal>
                </div>
            );
        };

        // --- MAIN APP SHELL ---
        const App = () => {
            const [currentRoute, setCurrentRoute] = useState('dashboard');
            const { loading, exportData } = useContext(AppContext);

            if (loading) return <div style={{padding:'40px', textAlign:'center'}}>Loading System Data...</div>;

            const renderContent = () => {
                switch(currentRoute) {
                    case 'dashboard': return <Dashboard />;
                    case 'events': return <Events />;
                    case 'pos': return <PurchaseOrders />;
                    case 'vials': return <Vials />;
                    default: return <Dashboard />;
                }
            };

            const NavItem = ({ id, label, icon: Icon }) => (
                <li className={`nav-item ${currentRoute === id ? 'active' : ''}`} onClick={() => setCurrentRoute(id)}>
                    <Icon /> {label}
                </li>
            );

            return (
                <div className="app-container">
                    <div className="sidebar">
                        <div className="sidebar-header">MedTrack Pro</div>
                        <ul className="nav-list">
                            <NavItem id="dashboard" label="Dashboard" icon={Icons.Dashboard} />
                            <NavItem id="events" label="Event List" icon={Icons.Event} />
                            <NavItem id="vials" label="Vial Tracker" icon={Icons.Vial} />
                            <NavItem id="pos" label="Purchase Orders" icon={Icons.PO} />
                        </ul>
                    </div>
                    
                    <div className="main-content">
                        <div className="topbar">
                            <h3 style={{margin:0, fontWeight:500}}>{currentRoute.charAt(0).toUpperCase() + currentRoute.slice(1)}</h3>
                            <button className="btn btn-secondary btn-sm" onClick={exportData} title="Backup Data to JSON">
                                <Icons.Download /> Export Data
                            </button>
                        </div>
                        <div className="content-area">
                            {renderContent()}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AppProvider>
                <App />
            </AppProvider>
        );
    </script>
</body>
</html>
